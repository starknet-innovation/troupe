# syntax=docker/sandbox-kit:3
# The workload kit every agent here builds on. sbx names a local kit after its folder, so this
# descriptor is coder.yaml in kits/coder and its recipe is coder.dockerfile beside it.
schemaVersion: "3"
kind: workload
version: 1.0.0
provides: ["coder@1.0.0"]

capabilities:
  # An agent sandbox: the host launches the agent instead of running the entrypoint as PID 1.
  - type: com.docker.sandbox/sbx@1
